name: Validate Drive folder browsing
on:
  push:
    branches: ["codex/drive-folder-validation-20261031"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        id: dependencies
        run: npm run install:ci
      - name: TypeScript
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx --no-install tsc --noEmit
      - name: Drive picker sessions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tests/google-drive-picker.mjs
      - name: Drive download protections
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tests/google-drive-client-download.mjs
      - name: Drive import permissions and replay
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tests/google-drive-import-permissions.mjs
      - name: Build existing production target
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build:recovery
      - name: Install test-only browser toolkit
        id: browser_toolkit
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install test browser
        id: test_browser
        if: ${{ !cancelled() && steps.browser_toolkit.outcome == 'success' }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Drive preview and retry UI
        if: ${{ !cancelled() && steps.test_browser.outcome == 'success' }}
        run: node tests/google-drive-import-ui.mjs
